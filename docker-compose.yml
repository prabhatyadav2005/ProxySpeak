version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: proxyspeak-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - MONGO_URI=mongodb://mongo:27017/proxyspeak
      - USE_REDIS=false
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: proxyspeak-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

  mongo:
    image: mongo:7-jammy
    container_name: proxyspeak-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
